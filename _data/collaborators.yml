  info: Assistant Professor of Otorhinolaryngology - Head and Neck Surgery
  email: roy.xiao@pennmedicine.upenn.edu
  bio: I am interested in discovering novel therapies for facial motion disorders and synkinesis. I am a Facial Plastic & Reconstructive Surgeon in the Department of Otorhinolaryngology. As Director of the Facial Nerve Center at Penn, I specialize in treating patients with facial paralysis and am seeking out ways to advance the care we provide to our patients. Outside of lab, I enjoy biking, photography, and indoor gardening.